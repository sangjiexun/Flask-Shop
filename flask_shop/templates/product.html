{% extends "layout.html" %}
{% block content %}
<h2>{{ product.name }}</h2>
<p>{{ product.desc }}</p>
<p>Price: {{ product.price|format_currency }}</p>
<img src="{{ url_for('product_picture', filename=product.pic) }}" alt="{{ product.name }}">
<form action="{{ url_for('buy') }}" method="post">
    <input type="hidden" name="product_id" value="{{ product.id }}">
    <input type="number" name="quantity" value="1" min="1">
    <input type="submit" value="Buy">
</form>
{% endblock %}
